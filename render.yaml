services:
  - type: web
    name: glydecurtains-backend
    runtime: java
    rootDir: backend
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/*.jar
    customDomains:
      - api.glydecurtains.com
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ORIGINS
        value: https://glydecurtains.com,https://www.glydecurtains.com

static_sites:
  - name: glydecurtains-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    customDomains:
      - glydecurtains.com
      - www.glydecurtains.com
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.glydecurtains.com
