services:
  - type: web
    name: glydecurtains-backend
    runtime: java
    rootDir: backend
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/*.jar
    domains:
      - api.glydecurtains.com
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ORIGINS
        value: https://glydecurtains.com,https://www.glydecurtains.com,https://glydecurtains-frontend.onrender.com
      # Signs admin login tokens; Render generates a random value once.
      - key: JWT_SECRET
        generateValue: true
      # The admin password. Set it in the Render dashboard (never commit it).
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: admin@glydecurtains.com

static_sites:
  - name: glydecurtains-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    domains:
      - glydecurtains.com
      - www.glydecurtains.com
    # Single-page app: send every path to index.html so deep links and page
    # refreshes (e.g. /products/12, /admin/dashboard) don't return 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.glydecurtains.com
