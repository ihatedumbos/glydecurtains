name: Keep backend awake

# Render's free plan puts the backend to sleep after 15 minutes without traffic,
# so the first visitor afterwards waits about a minute. This pings the cheap
# health endpoint every 10 minutes to keep it awake. GitHub may run scheduled
# jobs late at busy times, so an occasional sleep can still happen.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        run: |
          for url in https://api.glydecurtains.com/api/health https://glydecurtains-backend.onrender.com/api/health; do
            if curl -fsS --max-time 120 --retry 2 --retry-delay 10 "$url"; then
              echo
              echo "Backend is awake ($url)"
              exit 0
            fi
            echo "No answer from $url"
          done
          exit 1
