# Production environment profile
server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict

spring:
  h2:
    console:
      enabled: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins: https://glydecurtains.com,https://www.glydecurtains.com
  seed-data: false
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    com.glydecurtains: WARN
    org.springframework.security: WARN
