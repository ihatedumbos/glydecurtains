server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: glydecurtains

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/glydecurtains;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    mode: HTML
    encoding: UTF-8
    cache: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Retained only for inactive legacy token classes; JWT authorization is disabled.
    secret: temporary-no-auth-signing-key-change-when-jwt-is-restored-2026
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 86400000    # 24 hours
    remember-me-expiration-ms: 2592000000    # 30 days

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

  security:
    # Enforce JWT auth by default; opt out only in explicitly local-only dev setups.
    enable-auth: ${APP_SECURITY_ENABLE_AUTH:true}
