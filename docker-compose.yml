services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glyde-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-int}
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-glydecurtains-dev-secret-key-change-in-production-min-256-bits}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - glyde-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glyde-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - glyde-network

networks:
  glyde-network:
    driver: bridge
